<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Northstar Inventory — Live Manifest</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="topbar">
        <div class="topbar-left">
            <span class="eyebrow">Northstar Retail Co.</span>
            <h1>Live Inventory Manifest</h1>
        </div>
        <div class="topbar-right">
            <div class="status" id="status">
                <span class="pulse-dot" id="pulseDot"></span>
                <span id="statusText">Connecting…</span>
            </div>
            <div class="sync-meta">
                <span class="sync-label">Last sync</span>
                <span class="sync-time" id="lastSynced">—</span>
            </div>
        </div>
    </header>

    <main>
        <div class="manifest-panel">
            <div class="manifest-header">
                <span>Manifest</span>
                <span class="poll-tag" id="pollTag">polling every 10s</span>
            </div>

            <table class="manifest-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Product</th>
                        <th class="qty-col">Qty</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                    <tr class="loading-row">
                        <td colspan="4">Fetching cache…</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="summary-row" id="summaryRow"></div>
    </main>

    <footer>
        <span>Source: warehouse API (simulated) → sync cache → this dashboard</span>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
